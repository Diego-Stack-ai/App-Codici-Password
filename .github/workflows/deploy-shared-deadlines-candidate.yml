name: Deploy shared deadline Functions candidate

on:
  push:
    branches:
      - codex/shared-deadlines-20260908

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Run complete validation
        run: npm test

      - name: Deploy deadline Functions before frontend
        run: >-
          node node_modules/firebase-tools/lib/bin/firebase.js deploy
          --only functions:manageReceivedDeadline,functions:onScadenzaCreated,
          functions:onScadenzaUpdated,functions:onScadenzaDeleted,functions:checkDeadlines
          --token ${{ secrets.FIREBASE_TOKEN }}
