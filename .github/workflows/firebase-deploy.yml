name: Validate Firebase and deploy on approval
# Deploy di produzione solo tramite avvio manuale del workflow.

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - master
      - 'experiment/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify validation scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          run_full_suite=true

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
            if [ "${#changed_files[@]}" -gt 0 ] && ! printf '%s\n' "${changed_files[@]}" | grep -Ev '(^docs/|\.md$)' >/dev/null; then
              run_full_suite=false
            fi
          fi

          echo "run_full_suite=$run_full_suite" >> "$GITHUB_OUTPUT"
          {
            echo "### Validation scope"
            echo "- Full application suite: \`$run_full_suite\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify manual release source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master"
          remote_master="$(git ls-remote origin refs/heads/master | cut -f1)"
          test -n "$remote_master"
          test "$GITHUB_SHA" = "$remote_master"
          {
            echo "### Production candidate"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        if: steps.scope.outputs.run_full_suite == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase Emulator
        if: steps.scope.outputs.run_full_suite == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        if: steps.scope.outputs.run_full_suite == 'true'
        run: npm ci

      - name: Install Functions dependencies
        if: steps.scope.outputs.run_full_suite == 'true'
        run: npm ci --prefix functions

      - name: Run security and offline checks
        if: steps.scope.outputs.run_full_suite == 'true'
        run: npm test

      - name: Confirm documentation-only pull request
        if: steps.scope.outputs.run_full_suite == 'false'
        run: echo "Application checks skipped; the dedicated documentation workflow validates this pull request."

  deploy:
    name: Deploy Firebase production
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify master before deploy
        shell: bash
        run: |
          set -euo pipefail
          remote_master="$(git ls-remote origin refs/heads/master | cut -f1)"
          test -n "$remote_master"
          test "$GITHUB_SHA" = "$remote_master"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install deployment dependencies
        run: npm ci

      - name: Restore staged AI 2 packages
        uses: actions/cache@v4
        with:
          path: Frontend/public/assets/local-ai-packages
          key: local-ai-a2-${{ runner.os }}-${{ hashFiles('scripts/stage-local-ai-hosting-assets.mjs', 'Frontend/public/assets/js/modules/assistant/local-ai-hosting-catalog.generated.js') }}

      - name: Stage AI 2 Hosting packages
        run: npm run stage:assistant-local-ai

      - name: Verify AI 2 Hosting packages
        run: |
          npm run audit:assistant-local-ai-stage
          npm run build:assistant-local-ai-catalog
          git diff --exit-code -- Frontend/public/assets/js/modules/assistant/local-ai-hosting-catalog.generated.js

      # Le Functions restano escluse e richiedono un'autorizzazione separata.
      # FIREBASE_TOKEN resta temporaneamente il metodo CI esistente.
      - name: Deploy Hosting only
        run: node node_modules/firebase-tools/lib/bin/firebase.js deploy --project appcodici-password --only hosting --token ${{ secrets.FIREBASE_TOKEN }}

      - name: Verify public AI 2 packages
        env:
          LOCAL_AI_PUBLIC_ORIGIN: https://appcodici-password.web.app
        run: npm run verify:assistant-local-ai-publication

      - name: Record deployed commit
        shell: bash
        run: |
          set -euo pipefail
          remote_master="$(git ls-remote origin refs/heads/master | cut -f1)"
          test -n "$remote_master"
          test "$GITHUB_SHA" = "$remote_master"
          {
            echo "### Firebase Hosting deployed"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Scope: \`hosting\`"
          } >> "$GITHUB_STEP_SUMMARY"
