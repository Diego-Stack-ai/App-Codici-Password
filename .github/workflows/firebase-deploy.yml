name: Validate Firebase and deploy on approval
# Deploy di produzione solo tramite avvio manuale del workflow.

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Run security and offline checks
        run: npm test

  deploy:
    name: Deploy Firebase production
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install deployment dependencies
        run: npm ci

      # Le Functions restano escluse e richiedono un'autorizzazione separata.
      # FIREBASE_TOKEN resta temporaneamente il metodo CI esistente.
      - name: Deploy Hosting and security rules
        run: node node_modules/firebase-tools/lib/bin/firebase.js deploy --project appcodici-password --only hosting,firestore:rules,storage --token ${{ secrets.FIREBASE_TOKEN }}
