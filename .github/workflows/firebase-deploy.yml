name: Validate Firebase and deploy on approval
# Deploy di produzione solo tramite avvio manuale del workflow.

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - master
      - 'experiment/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Verify historical credential status before release scan
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/verify-historical-credential-status.mjs

      - name: Prepare release secret scan
        run: node scripts/prepare-gitleaks-config.mjs --output "$RUNNER_TEMP/gitleaks.toml"

      - name: Scan release commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ runner.temp }}/gitleaks.toml
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Classify validation scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          run_full_suite=true

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
            if [ "${#changed_files[@]}" -gt 0 ] && ! printf '%s\n' "${changed_files[@]}" | grep -Ev '(^docs/|\.md$)' >/dev/null; then
              run_full_suite=false
            fi
          fi

          echo "run_full_suite=$run_full_suite" >> "$GITHUB_OUTPUT"
          {
            echo "### Validation scope"
            echo "- Full application suite: \`$run_full_suite\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify manual release source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master"
          remote_master="$(git ls-remote origin refs/heads/master | cut -f1)"
          test -n "$remote_master"
          test "$GITHUB_SHA" = "$remote_master"
          {
            echo "### Production candidate"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        if: steps.scope.outputs.run_full_suite == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase Emulator
        if: steps.scope.outputs.run_full_suite == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        if: steps.scope.outputs.run_full_suite == 'true'
        run: npm ci

      - name: Install Functions dependencies
        if: steps.scope.outputs.run_full_suite == 'true'
        run: npm ci --prefix functions

      - name: Run security and offline checks
        if: steps.scope.outputs.run_full_suite == 'true'
        run: npm test

      - name: Verify canonical release version
        if: steps.scope.outputs.run_full_suite == 'true'
        run: npm run version:check

      - name: Build and verify release manifest
        if: github.event_name == 'workflow_dispatch'
        run: |
          node scripts/release-manifest.mjs --write --commit "$GITHUB_SHA" --require-clean
          node scripts/release-manifest.mjs --check --commit "$GITHUB_SHA" --require-clean

      - name: Confirm documentation-only pull request
        if: steps.scope.outputs.run_full_suite == 'false'
        run: echo "Application checks skipped; the dedicated documentation workflow validates this pull request."

  deploy:
    name: Deploy Firebase production
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify master before deploy
        shell: bash
        run: |
          set -euo pipefail
          remote_master="$(git ls-remote origin refs/heads/master | cut -f1)"
          test -n "$remote_master"
          test "$GITHUB_SHA" = "$remote_master"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install deployment dependencies
        run: npm ci

      - name: Prepare immutable release manifest
        run: |
          node scripts/release-manifest.mjs --write --commit "$GITHUB_SHA" --require-clean
          node scripts/release-manifest.mjs --check --commit "$GITHUB_SHA" --require-clean

      - name: Verify historical credential status before publication
        run: node scripts/verify-historical-credential-status.mjs

      # Le Functions restano escluse e richiedono un'autorizzazione separata.
      # FIREBASE_TOKEN resta temporaneamente il metodo CI esistente.
      - name: Recheck master and deploy Hosting only
        shell: bash
        run: |
          set -euo pipefail
          remote_master="$(git ls-remote origin refs/heads/master | cut -f1)"
          test -n "$remote_master"
          test "$GITHUB_SHA" = "$remote_master"
          node node_modules/firebase-tools/lib/bin/firebase.js deploy --project appcodici-password --only hosting --token ${{ secrets.FIREBASE_TOKEN }}

      - name: Verify deployed manifest and critical assets
        run: >-
          node scripts/release-manifest.mjs
          --commit "$GITHUB_SHA"
          --require-clean
          --verify-url https://appcodici-password.web.app
          --retries 8
          --delay-ms 5000

      - name: Record deployed commit
        shell: bash
        run: |
          set -euo pipefail
          remote_master="$(git ls-remote origin refs/heads/master | cut -f1)"
          test -n "$remote_master"
          {
            echo "### Firebase Hosting deployed"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Master after deploy: \`$remote_master\`"
            echo "- Scope: \`hosting\`"
            if [ "$GITHUB_SHA" != "$remote_master" ]; then
              echo "- Notice: master advanced after the final pre-deploy check; the approved workflow SHA remains the deployed source."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
