name: Validate and deploy Firebase
# Configurato il 2026-06-05 — Token CI attivo

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run security and offline checks
        run: npm test

      - name: Deploy Hosting, Functions and security rules
        run: node node_modules/firebase-tools/lib/bin/firebase.js deploy --only hosting,functions,firestore:rules,storage --token ${{ secrets.FIREBASE_TOKEN }}
