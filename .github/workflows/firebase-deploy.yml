name: Validate Firebase and deploy on approval
# Deploy di produzione solo tramite avvio manuale del workflow.

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - master
      - 'experiment/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify manual release source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master"
          remote_master="$(git ls-remote origin refs/heads/master | cut -f1)"
          test -n "$remote_master"
          test "$GITHUB_SHA" = "$remote_master"
          {
            echo "### Production candidate"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Run security and offline checks
        run: npm test

  deploy:
    name: Deploy Firebase production
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify master before deploy
        shell: bash
        run: |
          set -euo pipefail
          remote_master="$(git ls-remote origin refs/heads/master | cut -f1)"
          test -n "$remote_master"
          test "$GITHUB_SHA" = "$remote_master"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install deployment dependencies
        run: npm ci

      # Le Functions restano escluse e richiedono un'autorizzazione separata.
      # FIREBASE_TOKEN resta temporaneamente il metodo CI esistente.
      - name: Deploy Hosting only
        run: node node_modules/firebase-tools/lib/bin/firebase.js deploy --project appcodici-password --only hosting --token ${{ secrets.FIREBASE_TOKEN }}

      - name: Record deployed commit
        shell: bash
        run: |
          set -euo pipefail
          remote_master="$(git ls-remote origin refs/heads/master | cut -f1)"
          test -n "$remote_master"
          test "$GITHUB_SHA" = "$remote_master"
          {
            echo "### Firebase Hosting deployed"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Scope: \`hosting\`"
          } >> "$GITHUB_STEP_SUMMARY"
