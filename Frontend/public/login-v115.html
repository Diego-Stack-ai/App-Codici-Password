<!DOCTYPE html>
<html lang="it" class="dark protocol-forced-dark" data-i18n="ready">

<head>
    <!-- Anti-flicker & Theme Master (V3.9) -->
    <script src="assets/js/theme-init.js"></script>
    <script>
        // Recovery v1.2.0: rimuove il worker che causava il ciclo di reload.
        // Non elimina IndexedDB/Firestore e quindi non cancella i dati offline.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
                .then(registrations => Promise.all(registrations.map(registration => registration.unregister())))
                .catch(error => console.warn('[PWA] Deregistrazione non riuscita', error));
        }
    </script>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Codici & Password - Accedi</title>

    <link rel="icon" type="image/jpeg" href="assets/images/app-icon.jpg">
    <link rel="manifest" href="manifest.json?v=5.0" />
    <link rel="apple-touch-icon" sizes="192x192" href="./assets/images/app-icon.jpg">



    <!-- Design System Master (PROTOCOLLO V5.0) -->
    <link rel="stylesheet" href="assets/css/core.css?v=5.1">
    <link rel="stylesheet" href="assets/css/core_fonts.css">
    <link rel="stylesheet" href="assets/css/core_ui.css?v=5.0">

    <link rel="stylesheet" href="assets/css/accesso.css?v=5.0">

</head>

<body class="base-bg">
    <!-- 1. WRAPPER PRINCIPALE -->
    <div class="base-container">

        <!-- 2. FARO (Glow Effect) -->
        <div class="base-glow"></div>

        <!-- 3. VAULT CONTAINER -->
        <div class="vault">

            <!-- Card Login -->
            <div class="card border-glow">
                <!-- Language Selector (Anchor to Card) -->
                <div class="lang-selector-container">
                    <button id="lang-toggle-btn" class="lang-btn" aria-label="Cambia Lingua"
                        data-t-aria="select_language">
                        <span class="material-symbols-outlined">language</span>
                    </button>
                    <div id="lang-dropdown" class="lang-dropdown">
                        <!-- Popolato via JS -->
                    </div>
                </div>

                <!-- SAETTA MASTER ANIMATION -->
                <div class="saetta-master"></div>
                <div class="saetta-drop"></div>

                <!-- Icona Centrale -->
                <div class="icon-box">
                    <span class="material-symbols-outlined">security</span>
                </div>

                <!-- Titoli -->
                <h1 class="title" data-t="login_title">Accedi</h1>
                <p class="subtitle" data-t="login_subtitle">Accesso Sicuro</p>

                <!-- Form Autenticazione (V7.0 Blindato) -->
                <div id="login-form">

                    <!-- Email / Username -->
                    <div class="form-group">
                        <label class="label" for="email" data-t="username_label">Username</label>
                        <input id="email" type="email" autocomplete="username" required class="input"
                            data-t-placeholder="username_placeholder" placeholder="Email o Username">
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label class="label" for="password" data-t="password_label">Password</label>
                        <div class="password-wrapper">
                            <input id="password" type="password" autocomplete="current-password" required
                                class="input base-shield" placeholder="********"
                                data-t-placeholder="password_placeholder">
                            <button type="button" class="toggle-password" id="btn-toggle-password"
                                aria-label="Mostra Password" data-t-aria="show_hide_data">
                                <span class="material-symbols-outlined">visibility</span>
                            </button>
                        </div>

                        <a href="reset_password.html" id="link-forgot-password" class="link-forgot"
                            data-t="forgot_password">Password dimenticata?</a>
                    </div>

                    <!-- Secondo fattore: mostrato solo quando Firebase lo richiede -->
                    <div class="form-group hidden" id="totp-form-group">
                        <label class="label" for="totp-code">Codice Authenticator</label>
                        <input id="totp-code" type="text" inputmode="numeric" autocomplete="one-time-code"
                            maxlength="6" pattern="[0-9]{6}" class="input" placeholder="000000"
                            aria-describedby="totp-help">
                        <p id="totp-help" class="auth-help">Apri la tua app Authenticator e inserisci il codice di 6 cifre.</p>
                    </div>

                    <label class="remember-device" id="remember-device-row">
                        <input id="remember-device" type="checkbox" checked>
                        <span>Ricordami su questo dispositivo</span>
                    </label>

                    <!-- Submit Button -->
                    <button type="button" id="login-submit-btn" class="btn-primary" data-t="auth_button">
                        <span class="material-symbols-outlined">login</span>
                        Accedi
                    </button>

                </div>

                <!-- Registrazione Link -->
                <div class="auth-footer-links">
                    <a href="registrati.html" class="link-register" data-t="register_link">
                        Registrazione nuovo utente
                    </a>
                </div>

                <!-- Footer Legale -->
                <div class="legal-footer">
                    <span>&copy; 2026</span>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts (In fondo per performance) -->
    <script type="module" src="assets/js/main.js?v=1.2.0"></script>


</body>

</html>
