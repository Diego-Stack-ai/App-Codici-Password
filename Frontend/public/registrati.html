<!DOCTYPE html>
<html lang="it" class="dark protocol-forced-dark" data-i18n="loading">

<head>
    <!-- Anti-flicker & Theme Master (V3.9) -->
    <script src="assets/js/theme-init.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Codici & Password - Registrazione</title>

    <!-- PWA / Mobile Capable -->
    <link rel="manifest" href="manifest.json?v=1.2.31" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">



    <!-- Design System Master (PROTOCOLLO V5.0) -->
    <link rel="stylesheet" href="assets/css/core.css?v=1.2.31">
    <link rel="stylesheet" href="assets/css/core_fonts.css">
    <link rel="stylesheet" href="assets/css/core_ui.css?v=1.2.31">

    <link rel="stylesheet" href="assets/css/accesso.css?v=1.2.31">
</head>

<body class="base-bg">
    <!-- 1. WRAPPER PRINCIPALE -->
    <div class="base-container">

        <!-- 2. FARO (Glow Effect) -->
        <div class="base-glow"></div>

        <!-- 3. VAULT CONTAINER -->
        <div class="vault">

            <!-- Card Registrazione -->
            <div class="card border-glow">
                <!-- Language Selector (Anchor to Card) -->
                <div class="lang-selector-container">
                    <button id="lang-toggle-btn" class="lang-btn" aria-label="Cambia Lingua"
                        data-t-aria="select_language">
                        <span class="material-symbols-outlined">language</span>
                    </button>
                    <div id="lang-dropdown" class="lang-dropdown">
                        <!-- Popolato via JS -->
                    </div>
                </div>

                <!-- SAETTA MASTER ANIMATION -->
                <div class="saetta-master"></div>
                <div class="saetta-drop"></div>

                <!-- Icona Centrale -->
                <div class="icon-box">
                    <span class="material-symbols-outlined">person_add</span>
                </div>

                <!-- Titoli -->
                <h1 class="title" data-t="register_page_title">Registrati</h1>
                <p class="subtitle" data-t="register_subtitle">Crea il tuo account sicuro</p>

                <!-- Form Registrazione (V7.0 Blindato) -->
                <form id="register-form">
                    <!-- Nome & Cognome -->
                    <div class="form-row">
                        <div class="form-group">
                            <label class="label" for="nome" data-t="label_name">Nome</label>
                            <input id="nome" type="text" required class="input" data-t-placeholder="label_name"
                                placeholder="Mario" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label class="label" for="cognome" data-t="label_surname">Cognome</label>
                            <input id="cognome" type="text" required class="input" data-t-placeholder="label_surname"
                                placeholder="Rossi" autocomplete="off">
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label class="label" for="email" data-t="email_label">Email</label>
                        <input id="email" name="email" type="email" autocomplete="email" required class="input"
                            data-t-placeholder="email_placeholder" placeholder="mario.rossi@email.com">
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label class="label" for="password" data-t="password_label_reg">Password</label>
                        <div class="password-wrapper">
                            <input id="password" name="new-password" type="password" autocomplete="new-password" required class="input base-shield" aria-describedby="account-password-requirements"
                                data-t-placeholder="password_placeholder_reg" placeholder="********">
                            <button type="button" class="toggle-password" id="btn-toggle-password"
                                aria-label="Mostra Password" data-t-aria="show_hide_data">
                                <span class="material-symbols-outlined">visibility</span>
                            </button>
                        </div>
                        <button type="button" id="suggest-password-btn" class="password-suggestion-btn">
                            <span class="material-symbols-outlined">password</span>
                            Suggerisci password sicura
                        </button>
                    </div>

                    <ul id="account-password-requirements" class="password-requirements" aria-label="Requisiti password">
                        <li data-password-rule="minLength">Almeno 12 caratteri</li>
                        <li data-password-rule="lowercase">Una lettera minuscola</li>
                        <li data-password-rule="uppercase">Una lettera maiuscola</li>
                        <li data-password-rule="number">Un numero</li>
                        <li data-password-rule="symbol">Un simbolo</li>
                        <li data-password-rule="noOuterWhitespace">Nessuno spazio iniziale o finale</li>
                    </ul>

                    <!-- Conferma Password -->
                    <div class="form-group">
                        <label class="label" for="confirm-password" data-t="confirm_password_label">Conferma
                            Password</label>
                        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required class="input base-shield"
                            data-t-placeholder="password_placeholder_reg" placeholder="********">
                    </div>


                    <!-- Submit Button -->
                    <button type="submit" id="register-submit-btn" class="btn-primary" data-t="create_account_btn">
                        <span class="material-symbols-outlined">person_add_alt</span>
                        Nuova registrazione
                    </button>

                </form>

                <!-- Login Link -->
                <div class="auth-footer-links">
                    <span data-t="have_account_text">Hai già un account?</span>
                    <a href="login-v115.html" class="link-register" data-t="login_now_link">
                        Accedi ora
                    </a>
                </div>

                <!-- Footer Legale -->
                <div class="legal-footer">
                    <span>&copy; 2026</span>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="assets/js/main-v129.js"></script>


</body>

</html>
