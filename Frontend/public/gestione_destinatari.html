<!DOCTYPE html>
<html lang="it" data-i18n="loading">
<head>
    <script src="assets/js/theme-init.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Gestione destinatari - Codici & Password</title>
    <link rel="manifest" href="manifest.json?v=1.2.63">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="assets/css/core.css?v=1.2.63">
    <link rel="stylesheet" href="assets/css/core_fonts.css">
    <link rel="stylesheet" href="assets/css/core_fascie.css">
    <link rel="stylesheet" href="assets/css/core_ui.css?v=1.2.63">
    <link rel="stylesheet" href="assets/css/moduli.css?v=1.2.63">
    <link rel="stylesheet" href="assets/css/gestione_destinatari.css?v=1.2.63">
</head>
<body class="base-bg" data-ui-model="configuration">
    <div class="base-container">
        <div class="base-glow"></div>
        <div class="archive-watermark" aria-hidden="true"><span class="material-symbols-outlined">contact_mail</span></div>
        <header id="header-placeholder" class="base-header"></header>
        <main class="base-main">
            <div class="page-container recipient-manager-page pt-header-extra pb-footer-extra">
                <section class="recipient-manager-intro">
                    <h2>Destinatari</h2>
                    <p>Rubrica unica utilizzata sia dalle Scadenze sia dalla condivisione degli account.</p>
                    <p class="recipient-manager-warning"><span class="material-symbols-outlined">verified_user</span> Un contatto in uso non può essere eliminato. Può essere disattivato senza modificare i record esistenti.</p>
                </section>

                <section class="recipient-editor-card">
                    <h3 id="recipient-form-title">Nuovo destinatario</h3>
                    <div class="recipient-form-grid">
                        <div class="form-group">
                            <label class="label-sm" for="recipient-first-name">Nome</label>
                            <input id="recipient-first-name" class="input" type="text" autocomplete="given-name" placeholder="Maria">
                        </div>
                        <div class="form-group">
                            <label class="label-sm" for="recipient-last-name">Cognome o descrizione</label>
                            <input id="recipient-last-name" class="input" type="text" autocomplete="family-name" placeholder="Rossi o Commercialista">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="label-sm" for="recipient-email">Email</label>
                        <input id="recipient-email" class="input" type="email" autocomplete="email" inputmode="email" placeholder="maria@example.com">
                    </div>
                    <div class="recipient-form-actions">
                        <button id="recipient-cancel" type="button" class="base-btn-secondary hidden">Annulla</button>
                        <button id="recipient-save" type="button" class="btn-primary">Salva destinatario</button>
                    </div>
                </section>

                <section class="recipient-list-section">
                    <div class="recipient-list-heading">
                        <h3>Rubrica</h3>
                        <span id="recipient-count" class="recipient-count">0</span>
                    </div>
                    <div id="recipient-list" class="recipient-list" aria-live="polite"></div>
                </section>

                <a id="recipient-return" class="base-btn-secondary recipient-return hidden" href="regole_scadenze.html">
                    <span class="material-symbols-outlined">arrow_back</span> Torna al modulo precedente
                </a>
            </div>
        </main>
        <footer id="footer-placeholder" class="base-footer"></footer>
    </div>
    <script type="module" src="assets/js/main-v129.js"></script>
</body>
</html>
