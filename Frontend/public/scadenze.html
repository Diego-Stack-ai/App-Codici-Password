<!DOCTYPE html>
<html lang="it" data-i18n="loading">

<head>
    <!-- Anti-flicker & Theme Master (V5.0) -->
    <script src="assets/js/theme-init.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title data-t="deadlines">Scadenze - PROTOCOLLO V5.0</title>

    <!-- PWA / Mobile Capable -->
    <link rel="manifest" href="manifest.json?v=1.2.39" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon-180.png">

    <!-- Design System Master (PROTOCOLLO V5.0) -->
    <link rel="stylesheet" href="assets/css/core.css?v=1.2.39">
    <link rel="stylesheet" href="assets/css/core_fonts.css">
    <link rel="stylesheet" href="assets/css/core_fascie.css">
    <link rel="stylesheet" href="assets/css/core_ui.css?v=1.2.39">
    <link rel="stylesheet" href="assets/css/moduli.css">
    <link rel="stylesheet" href="assets/css/scadenze.css?v=1.2.39">

    <!-- CORE JS (Orchestrator V5.0) -->
</head>

<body class="base-bg">
    <div class="base-container">
        <!-- Ambient Glow -->
        <div class="base-glow"></div>

        <!-- Automated Header -->
        <header id="header-placeholder" class="base-header"></header>

        <main class="base-main">
            <div class="page-container pt-header-extra pb-footer-extra">

                <!-- Toolbar: Count + Sort (Ora SOPRA la ricerca) -->
                <div class="deadline-toolbar">
                    <!-- Left: Count -->
                    <div class="deadline-count-wrapper">
                        <span id="deadline-count" class="deadline-count-badge">0</span>
                        <span data-t="deadlines_total" class="deadline-count-label">Scadenze</span>
                    </div>

                    <!-- Right: Sort Dropdown -->
                    <div class="base-dropdown">
                        <button id="sort-btn" class="base-btn-secondary deadline-sort-btn">
                            <span class="material-symbols-outlined">sort</span>
                            <span data-t="sort_by" class="deadline-sort-label">Ordina</span>
                            <span class="material-symbols-outlined">expand_more</span>
                        </button>
                        <div id="sort-menu" class="base-dropdown-menu deadline-sort-menu">
                            <div class="base-dropdown-item active" data-t="sort_date_near" data-value="date-asc">DATA
                                (VICINA)</div>
                            <div class="base-dropdown-item" data-t="sort_date_far" data-value="date-desc">DATA (LONTANA)
                            </div>
                            <div class="base-dropdown-item" data-t="sort_name_az" data-value="name-asc">NOME (A-Z)</div>
                            <div class="base-dropdown-item" data-t="sort_name_za" data-value="name-desc">NOME (Z-A)
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Search Bar (SOTTO la toolbar) -->
                <div id="search-bar-container" class="search-bar-container search-bar-animated">
                    <div class="search-input-wrapper">
                        <span class="material-symbols-outlined">search</span>
                        <input id="deadline-search" type="text" data-t-placeholder="search_deadlines_placeholder"
                            placeholder="Cerca scadenze..." />
                    </div>
                </div>

                <!-- Filter Chips -->
                <div class="filter-container">
                    <button class="filter-chip active" data-filter="all" data-t="filter_all">Tutte</button>
                    <button class="filter-chip" data-filter="urgent" data-t="filter_urgent">Urgenti</button>
                    <button class="filter-chip" data-filter="expiring" data-t="filter_expiring">In scadenza</button>
                    <button class="filter-chip" data-filter="completed" data-t="filter_completed">Completate</button>
                </div>

                <!-- List Content -->
                <div id="scadenze-list" class="archive-list-group">
                    <!-- Loading State (V3.9 Standard) -->
                    <div class="archive-loading-container">
                        <div class="archive-spinner"></div>
                        <p class="archive-loading-text" data-t="analyzing_data">Analisi dati...</p>
                    </div>
                </div>

                <!-- Spacer Footer rimosso: gestito da padding .page-container -->
            </div>
        </main>

        <!-- Automated Footer -->
        <footer id="footer-placeholder" class="base-footer"></footer>
    </div>

    <!-- Scripts -->
    <script type="module" src="assets/js/main-v129.js"></script>
</body>
