<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PROVA">
    <meta name="robots" content="noindex, nofollow">
    <title>PROVA</title>
    <style>
        :root {
            color-scheme: light;
            --bg-primary: #e2e8f0;
            --base-box-gradient: linear-gradient(135deg, #e0f2fe 0%, #60a5fa 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            background-color: var(--bg-primary);
            background-image: var(--base-box-gradient);
            background-repeat: no-repeat;
            background-size: cover;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
        }

        .proof {
            padding: 18px 30px;
            border: 2px solid rgb(255 255 255 / 75%);
            border-radius: 24px;
            background: rgb(255 255 255 / 78%);
            color: #0f172a;
            box-shadow: 0 16px 40px rgb(15 23 42 / 18%);
            font-size: clamp(32px, 11vw, 64px);
            font-weight: 800;
            letter-spacing: 0.08em;
        }
    </style>
</head>
<body>
    <main class="proof">PROVA</main>
</body>
</html>
