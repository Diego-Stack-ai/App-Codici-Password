<head>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Codici & Password - Recupero</title>

    <!-- PWA / Mobile Capable -->
    <link rel="manifest" href="manifest.json?v=1.2.41" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon-180.png">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="assets/css/accesso.css?v=1.2.41">

<body class="base-bg">
    <!-- 1. WRAPPER PRINCIPALE -->
    <div class="base-container">

        <!-- 2. FARO (Glow Effect) -->
        <div class="base-glow"></div>

        <!-- 3. VAULT CONTAINER -->
        <div class="vault">

            <!-- Card Reset -->
            <div class="card border-glow">
                <!-- Language Selector (Anchor to Card) -->
                <div class="lang-selector-container">
                    <button id="lang-toggle-btn" class="lang-btn" aria-label="Cambia Lingua"
                        data-t-aria="select_language">
                        <span class="material-symbols-outlined">language</span>
                    </button>
                    <div id="lang-dropdown" class="lang-dropdown">
                        <!-- Popolato via JS -->
                    </div>
                </div>

                <!-- SAETTA MASTER ANIMATION -->
                <div class="saetta-master"></div>
                <div class="saetta-drop"></div>

                <!-- Icona Centrale -->
                <div class="icon-box">
                    <span class="material-symbols-outlined">lock_reset</span>
                </div>

                <!-- Titoli -->
                <h1 class="title" data-t="reset_page_title">Recupero</h1>
                <p class="subtitle" data-t="reset_hint">Ti invieremo un collegamento sicuro per impostare una nuova
                    chiave d'accesso.</p>

                <!-- Form Recupero -->
                <form id="reset-form">

                    <!-- Email -->
                    <div class="form-group">
                        <label class="label" for="email" data-t="email_address_label">Indirizzo Email</label>
                        <input id="email" name="email" type="email" autocomplete="email" required class="input"
                            data-t-placeholder="email_placeholder" placeholder="mario.rossi@email.com">
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="reset-submit-btn" class="btn-primary" data-t="send_instructions_btn">
                        <span class="material-symbols-outlined">send</span>
                        Invia istruzioni
                    </button>

                </form>

                <!-- Back Link -->
                <div class="auth-footer-links">
                    <a href="login-v115.html" class="link-register flex-icon" data-t="back_to_login_link">
                        <span class="material-symbols-outlined">arrow_back</span>
                        Torna all'accesso
                    </a>
                </div>

                <!-- Footer Legale -->
                <div class="legal-footer">
                    <span>&copy; 2026</span>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="assets/js/main-v129.js"></script>
