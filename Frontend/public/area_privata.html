<body class="base-bg area-private-page">
    <!-- CORE JS (Body-Start) -->

    <div class="base-container">
        <!-- Ambient Glow -->
        <div class="base-glow"></div>

        <!-- HEADER FISSO -->
        <header id="header-placeholder" class="base-header"></header>

        <!-- MAIN CONTENT -->
        <main class="base-main">
            <div class="page-container pt-header-extra pb-footer-extra">

                <!-- MATRIX GRID NAV -->
                <div class="matrix-grid">

                    <!-- Account Standard -->
                    <a href="account_privati.html?type=standard"
                        class="matrix-card card-blue border-glow adaptive-shadow area-standard">
                        <div class="matrix-icon-box">
                            <span class="material-symbols-outlined">lock</span>
                        </div>
                        <div class="card-text-block">
                            <h3 data-t="section_personal_accounts">Account Standard</h3>
                            <span id="count-standard" class="badge-count">-</span>
                        </div>
                    </a>

                    <!-- Condivisi -->
                    <a href="account_privati.html?type=shared"
                        class="matrix-card card-red border-glow adaptive-shadow area-shared">
                        <div class="matrix-icon-box">
                            <span class="material-symbols-outlined">group</span>
                        </div>
                        <div class="card-text-block">
                            <h3 data-t="section_shared_accounts">Condivisi</h3>
                            <span id="count-shared" class="badge-count">-</span>
                        </div>
                    </a>

                    <!-- Memorandum (Note) -->
                    <a href="account_privati.html?type=memo"
                        class="matrix-card card-orange border-glow adaptive-shadow area-memo">
                        <div class="matrix-icon-box">
                            <span class="material-symbols-outlined">edit_note</span>
                        </div>
                        <div class="card-text-block">
                            <h3 data-t="section_note">Note Private</h3>
                            <span id="count-memo" class="badge-count">-</span>
                        </div>
                    </a>

                    <!-- Memo Condivisi -->
                    <a href="account_privati.html?type=shared_memo"
                        class="matrix-card card-green border-glow adaptive-shadow area-shared-memo">
                        <div class="matrix-icon-box">
                            <span class="material-symbols-outlined">hub</span>
                        </div>
                        <div class="card-text-block">
                            <h3 data-t="section_shared_note">Note Condivise</h3>
                            <span id="count-shared-memo" class="badge-count">-</span>
                        </div>
                    </a>

                    <!-- TOP 10 WIDGET SECTION -->
                    <div class="area-top10">
                        <div class="top10-widget-header">
                            <div class="top10-header-left">
                                <div class="mini-icon-box icon-amber">
                                    <span class="material-symbols-outlined star-icon">star</span>
                                </div>
                                <h3 class="top10-title" data-t="top_used_access">TOP 10 PIÙ USATI</h3>
                            </div>
                            <!-- Reset views btn -->
                            <button id="btn-reset-views" class="btn-icon-minimal" title="Reset Visti">
                                <div class="reset-text-stack">

                                    <span>STATISTICA</span>
                                </div>
                                <span class="material-symbols-outlined">restart_alt</span>

                        </div>

                            <div class="loading-box">
                                <span class="material-symbols-outlined animate-spin-slow">sync</span>
