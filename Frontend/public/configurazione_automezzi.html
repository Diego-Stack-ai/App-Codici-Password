<!DOCTYPE html>
<html lang="it" data-i18n="loading">

<head>
    <!-- Anti-flicker & Theme Master (V5.0) -->
    <script src="assets/js/theme-init.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-t="vehicles_config_title">Configurazione Automezzi - PROTOCOLLO BASE V5.0</title>

    <!-- PWA / Mobile Capable -->
    <link rel="manifest" href="manifest.json?v=1.2.40" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Design System Master (PROTOCOLLO V5.0) -->
    <link rel="stylesheet" href="assets/css/core.css?v=1.2.40">
    <link rel="stylesheet" href="assets/css/core_fonts.css">
    <link rel="stylesheet" href="assets/css/core_fascie.css">
    <link rel="stylesheet" href="assets/css/core_ui.css?v=1.2.40">
    <link rel="stylesheet" href="assets/css/moduli.css?v=1.2.40">
    <link rel="stylesheet" href="assets/css/configurazione_automezzi.css?v=1.2.40">
</head>

<body class="base-bg">
    <!-- CORE JS (Body-Start) -->

    <div class="base-container">
        <!-- Ambient Glow -->
        <div class="base-glow"></div>

        <!-- Background Watermark (Global) -->
        <div class="archive-watermark" aria-hidden="true">
            <span class="material-symbols-outlined">directions_car</span>
        </div>

        <!-- Automated Header -->
        <header id="header-placeholder" class="base-header"></header>

        <!-- Main Content -->
        <main class="base-main">
            <div class="page-container archive-page-content pt-header-extra pb-footer-extra">

                <div class="saetta-master"></div>

                <!-- 1. Tipi Scadenza / Oggetti Email -->
                <div class="settings-group">
                    <div class="settings-item collapsible-header" data-target="container-types" role="button"
                        aria-expanded="false" data-t-aria="aria_toggle_section">
                        <div class="settings-item-header-row">
                            <div class="settings-icon-box icon-blue">
                                <span class="material-symbols-outlined">directions_car</span>
                            </div>
                            <div class="settings-item-info">
                                <h3 class="settings-label" data-t="email_subjects">Tipi Scadenza</h3>
                            </div>
                            <div class="settings-header-actions">
                                <button type="button" id="btn-add-type" class="btn-icon-add"
                                    data-t-aria="aria_add_new_type">
                                    <span class="material-symbols-outlined">add</span>
                                </button>
                                <span class="material-symbols-outlined arrow-icon">expand_more</span>
                            </div>
                        </div>
                    </div>
                    <div id="container-types" class="settings-dropdown-panel hidden">
                        <!-- Rendered via JS -->
                    </div>
                </div>

                <!-- 2. Modelli & Targhe -->
                <div class="settings-group">
                    <div class="settings-item collapsible-header" data-target="container-models" role="button"
                        aria-expanded="false" data-t-aria="aria_toggle_section">
                        <div class="settings-item-header-row">
                            <div class="settings-icon-box icon-amber">
                                <span class="material-symbols-outlined">minor_crash</span>
                            </div>
                            <div class="settings-item-info">
                                <h3 class="settings-label" data-t="models_plates">Modelli & Targhe</h3>
                            </div>
                            <div class="settings-header-actions">
                                <button type="button" id="btn-add-model" class="btn-icon-add"
                                    data-t-aria="aria_add_new_vehicle">
                                    <span class="material-symbols-outlined">add</span>
                                </button>
                                <span class="material-symbols-outlined arrow-icon">expand_more</span>
                            </div>
                        </div>
                    </div>
                    <div id="container-models" class="settings-dropdown-panel hidden">
                        <!-- Rendered via JS -->
                    </div>
                </div>

                <!-- 3. Testi E-Mail -->
                <div class="settings-group">
                    <div class="settings-item collapsible-header" data-target="container-templates" role="button"
                        aria-expanded="false" data-t-aria="aria_toggle_section">
                        <div class="settings-item-header-row">
                            <div class="settings-icon-box icon-purple">
                                <span class="material-symbols-outlined">mail</span>
                            </div>
                            <div class="settings-item-info">
                                <h3 class="settings-label" data-t="email_templates">Testo E-Mail</h3>
                            </div>
                            <div class="settings-header-actions">
                                <button type="button" id="btn-add-template" class="btn-icon-add"
                                    data-t-aria="aria_add_new_template">
                                    <span class="material-symbols-outlined">add</span>
                                </button>
                                <span class="material-symbols-outlined arrow-icon">expand_more</span>
                            </div>
                        </div>
                    </div>
                    <div id="container-templates" class="settings-dropdown-panel hidden">
                        <!-- Rendered via JS -->
                    </div>
                </div>

                <!-- Syntax Info (V5.0 Standard) -->
                <div class="page-footer-info">
                    <div class="archive-row-container">
                        <div class="syntax-header">
                            <span class="material-symbols-outlined">info</span>
                            <span class="syntax-title" data-t="section_syntax_title">Sintassi Automatica</span>
                        </div>
                        <div class="syntax-inline-container">
                            <div class="syntax-row">
                                <span class="config-item-desc" data-t="subject_label">Oggetto:</span>
                                <span class="config-badge config-badge-blue" data-t="object_tag">[Oggetto]</span>
                                <span class="config-badge config-badge-amber" data-t="plate_tag">[Targa]</span>
                            </div>
                            <div class="syntax-row">
                                <span class="config-item-desc" data-t="body_label">Corpo:</span>
                                <span class="config-badge config-badge-blue" data-t="object_tag">[Oggetto]</span>
                                <span class="config-badge config-badge-emerald" data-t="data_tag">[Data]</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Spacer rimosso: gestito da pb-footer-extra -->
            </div>
        </main>

        <!-- FOOTER PLACEHOLDER -->
        <footer id="footer-placeholder" class="base-footer"></footer>
    </div>

    <!-- Scripts -->
    <script type="module" src="assets/js/main-v129.js"></script>

</body>

</html>
