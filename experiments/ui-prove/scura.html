<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prova 3 – Scura sicura</title>
  <script src="tema-init.js"></script>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="scura.css">
</head>
<body data-direzione="scura">
  <div class="app">
    <section id="vista-lista" class="vista vista-lista" aria-label="Elenco account">
      <header class="barra-alta">
        <a class="btn-icona" href="index.html" aria-label="Torna alla scelta delle prove"><span class="icona" aria-hidden="true">arrow_back</span></a>
        <p class="barra-titolo">Account privati</p>
        <button class="btn-icona" type="button" data-azione="tema" aria-label="Cambia tema"><span class="icona" aria-hidden="true">brightness_auto</span></button>
      </header>
      <div class="scorrevole">
        <div class="testata">
          <h1 class="titolo-grande">Account privati</h1>
          <p class="conteggio" id="conteggio"></p>
        </div>
        <label class="ricerca">
          <span class="icona" aria-hidden="true">search</span>
          <span class="sr">Cerca account</span>
          <input id="ricerca" type="search" placeholder="Cerca account" autocomplete="off" spellcheck="false">
        </label>
        <div id="filtri" class="filtri" role="group" aria-label="Filtra per categoria"></div>
        <div id="elenco" class="elenco"></div>
      </div>
      <button class="fab" type="button" data-azione="finta" aria-label="Nuovo account"><span class="icona" aria-hidden="true">add</span></button>
    </section>

    <section id="vista-dettaglio" class="vista vista-dettaglio" aria-labelledby="titolo-dettaglio" hidden>
      <header class="barra-alta">
        <button class="btn-icona btn-indietro" type="button" aria-label="Torna all’elenco"><span class="icona" aria-hidden="true">arrow_back</span></button>
        <p class="barra-titolo" id="titolo-dettaglio"></p>
        <button class="btn-testo" id="btn-modifica" type="button">Modifica</button>
      </header>
      <div class="scorrevole" id="corpo-dettaglio"></div>
    </section>

    <nav class="barra-schede" aria-label="Sezioni dell’app">
      <button class="scheda" type="button" data-azione="finta"><span class="icona" aria-hidden="true">home</span>Home</button>
      <button class="scheda" type="button" aria-current="page"><span class="icona" aria-hidden="true">key</span>Account</button>
      <button class="scheda" type="button" data-azione="finta"><span class="icona" aria-hidden="true">event</span>Scadenze</button>
      <button class="scheda" type="button" data-azione="finta"><span class="icona" aria-hidden="true">settings</span>Impostazioni</button>
    </nav>

    <div id="avviso" class="avviso" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="prova.js"></script>
</body>
</html>
